<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design Playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@100;400;700;800&family=Inter:wght@400;500;600;700;800&family=Inter+Tight:wght@400;500;600;700;800;900&family=Archivo:wght@400;500;700;800;900&family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;700&family=Space+Mono:wght@400;700&family=JetBrains+Mono:wght@400;700&family=DotGothic16&family=VT323&display=swap">
<style>
/* ===== サイト本体：すべて CSS 変数（パラメータ）で制御 ===== */
:root {
  --bg: #efefed; --card: #ffffff; --edge: #e2e2e0; --ink: #111111; --muted: #7a7a7a; --line: #000000; --accent: #111111;
  --font-d: "Helvetica Neue", Helvetica, Arial, "Hiragino Sans", sans-serif; --dw: 700; --ts: 15px; --tr: -0.02em;
  --font-b: "Helvetica Neue", Helvetica, Arial, "Hiragino Sans", sans-serif; --bs: 13px; --btr: 0em;
  --font-m: "IBM Plex Mono", ui-monospace, monospace; --mcase: uppercase;
  --per: 4; --gap: 20px; --margin: 32px; --maxw: 1400px; --radius: 2px; --pad: 16px;
  --lo: .18; --lw: 1px; --ls: dashed; --cell: 100px;
}
* { box-sizing: border-box; }
html, body { margin: 0; overflow-x: clip; }
body {
  position: relative; min-height: 100vh; background: var(--bg); color: var(--ink);
  font-family: var(--font-b); font-size: var(--bs); line-height: 1.6; letter-spacing: var(--btr);
  font-feature-settings: "palt"; -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
p { margin: 0; }
#app { position: relative; z-index: 1; padding-bottom: 80px; }
.frame { max-width: var(--maxw); margin: 0 auto; padding: 0 var(--margin); }
.s { font-family: var(--font-m); font-size: 10.5px; line-height: 1.5; letter-spacing: .02em; text-transform: var(--mcase); }
.m { color: var(--muted); }
.lnk { color: var(--accent); }
.lnk:hover { text-decoration: underline; text-underline-offset: 3px; }

/* グリッド線（カードの列に揃う） */
.overlay { position: absolute; inset: 0; pointer-events: none; opacity: var(--lo); overflow: hidden; }
.overlay.back { z-index: 0; } .overlay.front { z-index: 50; } .overlay.none { display: none; }
.ov-inner { position: relative; height: 100%; max-width: var(--maxw); margin: 0 auto; padding: 0 var(--margin); }
.ov-cols { height: 100%; display: grid; grid-template-columns: repeat(var(--per), minmax(0, 1fr)); column-gap: var(--gap); }
.ov-cols i { border-left: var(--lw) var(--ls) var(--line); border-right: var(--lw) var(--ls) var(--line); }
.ov-rows { position: absolute; left: var(--margin); right: var(--margin); }
.ov-rows b { display: block; height: var(--cell); border-top: var(--lw) var(--ls) var(--line); }

/* header：小さなロゴを中央に */
.top { text-align: center; padding: 48px 0 40px; }
.logo { font: var(--dw) 30px/1 var(--font-d); letter-spacing: -0.05em; display: inline-block; }
.top .s { margin-top: 8px; }

/* filter */
.filters { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-bottom: 14px; }
.filters button { font: inherit; text-transform: inherit; background: none; border: 0; padding: 0; color: var(--muted); cursor: pointer; }
.filters button.on { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }

/* card grid（Cosense 風：すべて正方形） */
.cards { display: grid; grid-template-columns: repeat(var(--per), minmax(0, 1fr)); gap: var(--gap); }
.card { aspect-ratio: 1 / 1; background: var(--card); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; position: relative; transition: transform .15s ease, box-shadow .15s ease; }
.cards.shadow .card { box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 0 0 1px rgba(0,0,0,.02); }
.cards.shadow a.card:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(0,0,0,.12); }
.cards.line .card { border: var(--lw) solid var(--edge); }
.cards.line a.card:hover { border-color: var(--ink); }
.cards.flat a.card:hover { background: color-mix(in srgb, var(--card) 92%, var(--ink)); }
.card h3 { margin: 0; padding: var(--pad) var(--pad) 0; font: var(--dw) var(--ts)/1.3 var(--font-d); letter-spacing: var(--tr); }
.card .body { flex: 1; min-height: 0; padding: 10px var(--pad) var(--pad); overflow: hidden; }
.card .body.txt { display: flex; flex-direction: column; justify-content: center; }
.card .img { flex: 1; min-height: 0; margin-top: 12px; overflow: hidden; }
.card .img svg { width: 100%; height: 100%; display: block; }
.card .img, .page .fig { --bg: var(--card); }
.cards.center .card .img { margin: 12px auto var(--pad); width: 64%; flex: none; aspect-ratio: 1 / 1; }
.card .meta { position: absolute; right: var(--pad); top: calc(var(--pad) + 2px); }
.card .lines div { padding: 1px 0; }
.card .lines .s { display: inline-block; min-width: 7.5em; }
.about-mark { font: var(--dw) clamp(28px, 3.4vw, 54px)/.9 var(--font-d); letter-spacing: -0.055em; }

/* article（Cosense のページ風） */
.page { max-width: 760px; margin: 0 auto; background: var(--card); border-radius: var(--radius); padding: clamp(20px, 4vw, 48px); }
.cards.shadow ~ .page, .page.shadow { box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.page.line { border: var(--lw) solid var(--edge); }
.page h1 { font: var(--dw) clamp(24px, 3vw, 34px)/1.25 var(--font-d); letter-spacing: var(--tr); margin: 6px 0 12px; }
.page .fig { width: min(100%, 440px); aspect-ratio: 1 / 1; margin: 20px 0; border: var(--lw) solid var(--edge); }
.page .fig svg { width: 100%; height: 100%; display: block; }
.prose { font-size: 15px; line-height: 1.85; }
.prose p + p { margin-top: .9em; }
.prose h2 { font: 700 16px/1.4 var(--font-d); margin: 2em 0 .5em; }
.prose pre { font: 12px/1.6 var(--font-m); background: var(--bg); padding: 12px; overflow-x: auto; border-radius: var(--radius); }
.prose ul { padding-left: 1.2em; }
.related { max-width: 760px; margin: 40px auto 0; }
.related .cards { --per: 4; }

@media (max-width: 900px) { .cards { grid-template-columns: repeat(min(var(--per), 3), minmax(0, 1fr)); } }
@media (max-width: 640px) {
  .cards, .related .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .ov-cols { grid-template-columns: repeat(2, 1fr); column-gap: 12px; }
  .ov-cols i:nth-child(n + 3) { display: none; }
  :root { --margin: 14px !important; --pad: 12px !important; }
  .card h3 { font-size: 13px; }
  .about-mark { font-size: 30px; }
  .card .lines .s { min-width: 0; display: block; }
}

/* ===== 調整パネル（サイトの変数に影響されない） ===== */
#panel-toggle { position: fixed; right: 16px; bottom: 16px; z-index: 1000; background: #111; color: #fff; border: 0; border-radius: 999px; padding: 12px 18px; font: 600 13px/1 -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; cursor: pointer; box-shadow: 0 6px 24px rgba(0,0,0,.25); letter-spacing: 0; }
#panel { position: fixed; top: 0; right: 0; bottom: 0; width: 340px; z-index: 999; background: #fff; color: #222; border-left: 1px solid #ddd; font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; letter-spacing: 0; text-transform: none; display: flex; flex-direction: column; transform: translateX(100%); transition: transform .25s ease; box-shadow: -8px 0 32px rgba(0,0,0,.12); }
#panel.open { transform: none; }
#panel:not(.open) { box-shadow: none; visibility: hidden; transition: transform .25s ease, visibility 0s .25s; }
#panel header { padding: 14px 16px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
#panel .scroll { overflow-y: auto; flex: 1; padding: 0 16px 120px; }
#panel details { border-bottom: 1px solid #eee; }
#panel summary { padding: 12px 0; font-weight: 700; cursor: pointer; }
#panel .row2 { display: grid; grid-template-columns: 96px 1fr 48px; gap: 8px; align-items: center; margin-bottom: 10px; }
#panel .row2 label { color: #555; font-size: 12px; }
#panel .row2 output { font-size: 11px; color: #888; text-align: right; font-variant-numeric: tabular-nums; }
#panel input[type=range] { width: 100%; }
#panel input[type=color] { width: 100%; height: 28px; border: 1px solid #ddd; border-radius: 6px; padding: 0 2px; background: #fff; }
#panel select, #panel input[type=text], #panel textarea { width: 100%; font: inherit; padding: 5px 6px; border: 1px solid #ccc; border-radius: 6px; background: #fff; color: #222; }
#panel textarea { resize: vertical; min-height: 54px; }
#panel .presets { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 14px 0; }
#panel .preset { border: 1px solid #ddd; border-radius: 8px; padding: 8px; background: #fafafa; cursor: pointer; text-align: left; font: inherit; color: #222; }
#panel .preset:hover { border-color: #111; }
#panel .swatches { display: flex; gap: 3px; margin-top: 6px; }
#panel .swatches i { width: 14px; height: 14px; border-radius: 3px; border: 1px solid rgba(0,0,0,.15); }
#panel .btns { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 12px; }
#panel button.bt { font: inherit; font-size: 12px; padding: 6px 10px; border: 1px solid #ccc; border-radius: 6px; background: #fff; color: #222; cursor: pointer; }
#panel button.bt:hover { border-color: #111; }
#panel button.bt.primary { background: #111; color: #fff; border-color: #111; }
#panel .slot { display: flex; align-items: center; gap: 6px; padding: 6px 0; border-top: 1px dashed #eee; }
#panel .slot span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#panel .note { color: #888; font-size: 11px; margin: 4px 0 10px; }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #111; color: #fff; padding: 8px 14px; border-radius: 8px; font: 13px -apple-system, sans-serif; z-index: 1001; opacity: 0; transition: opacity .2s; pointer-events: none; }
#toast.show { opacity: 1; }
@media (max-width: 640px) { #panel { width: 100%; top: 35vh; border-left: 0; border-top: 1px solid #ddd; border-radius: 14px 14px 0 0; transform: translateY(100%); } }
</style>
</head>
<body>
<div class="overlay back" id="overlay"><div class="ov-inner"><div class="ov-cols" id="ov-cols"></div><div class="ov-rows" id="ov-rows"></div></div></div>
<div id="app"></div>

<button id="panel-toggle">🎨 デザイン調整</button>
<aside id="panel">
  <header><b>デザイン調整</b><button class="bt" id="panel-close">閉じる</button></header>
  <div class="scroll" id="panel-body"></div>
</aside>
<div id="toast"></div>

<script>
/* ---------- サンプルコンテンツ ---------- */
const POSTS = [
  { date: "2026.10.25", tag: "Illusion",    title: "カフェウォール錯視をシェーダーで再現する", text: "平行な線が傾いて見える仕組みを GLSL で分解する。", art: 0 },
  { date: "2026.10.18", tag: "Perspective", title: "アナモルフォーシスの作図を自動化した", text: "1 点から見たときだけ形が揃う絵を three.js で計算する。", art: 1 },
  { date: "2026.10.10", tag: "Illusion",    title: "カニッツァの三角形と「見えない輪郭」", text: "存在しない線を脳が描くとき、何が起きているのか。", art: 3 },
  { date: "2026.10.02", tag: "Tech",        title: "TouchDesigner で消失点をリアルタイムに動かす", text: "鑑賞者の位置に追従する遠近法のプロトタイプ。", art: 2 },
  { date: "2026.09.24", tag: "Perspective", title: "エイムズの部屋を 1/10 スケールで作った", text: "床と壁の歪ませ方、実寸の図面を公開。", art: 9 },
  { date: "2026.09.15", tag: "Exhibition",  title: "展示レポート：錯視とメディアアートの 10 年", text: "会場で見た作品と、自分の制作への気づき。", art: 4 },
  { date: "2026.09.03", tag: "Illusion",    title: "ヘルマン格子の灰色の点はどこから来るか", text: "交差点に現れる「ない点」を観察する。", art: 8 },
  { date: "2026.08.27", tag: "Tech",        title: "錯視図形を SVG で生成するライブラリを作った", text: "このサイトの画像もすべてコードで描いています。", art: 5 },
];
const NEWS = [
  { date: "2026.10.25", title: "ポートフォリオサイトを公開しました" },
  { date: "2026.11.08", title: "トーク登壇「遠近法をハックする」" },
  { date: "2026.11.20", title: "新作インスタレーション展示予定" },
];
const WORKS = [
  { no: "W01", title: "Vanishing Room",    text: "Installation, 2026",       art: 10 },
  { no: "W02", title: "Impossible Blocks", text: "Generative / Web, 2026",   art: 6 },
  { no: "W03", title: "Phantom Edge",      text: "Projection Mapping, 2025", art: 3 },
  { no: "W04", title: "Hermann Field",     text: "Print, 2025",              art: 8 },
];

/* ---------- 錯視アート（白黒＋アクセント1色。色は CSS 変数に追従） ---------- */
const F = c => `style="fill:var(--${c})"`;
const S = (c, w = 4) => `style="fill:none;stroke:var(--${c});stroke-width:${w}"`;
const R = (n, f) => Array.from({ length: n }, (_, k) => f(k)).join("");
function art(i) {
  const v = [
    // 0 カフェウォール錯視
    () => `<rect width="400" height="400" ${F("bg")}/>` + R(8, r => R(6, c => `<rect x="${c * 80 - [0, 14, 28, 14][r % 4]}" y="${r * 50}" width="40" height="50" ${F("ink")}/>`) + `<line x1="0" y1="${r * 50}" x2="400" y2="${r * 50}" ${S("muted", 3)}/>`),
    // 1 透視の床
    () => `<rect width="400" height="400" ${F("bg")}/><circle cx="200" cy="140" r="56" ${F("accent")}/><rect y="160" width="400" height="240" ${F("bg")}/>`
        + R(17, k => `<line x1="200" y1="160" x2="${-600 + k * 75}" y2="400" ${S("ink", 2)}/>`)
        + R(9, k => { const y = 160 + 240 * Math.pow(k / 8, 2); return `<line x1="0" y1="${y}" x2="400" y2="${y}" ${S("ink", 2)}/>`; }),
    // 2 消失点トンネル
    () => R(14, k => { const t = Math.pow(0.8, k); return `<rect x="${250 - 250 * t}" y="${170 - 170 * t}" width="${400 * t}" height="${400 * t}" ${F(k % 2 ? "bg" : "ink")}/>`; })
        + [[0, 0], [400, 0], [0, 400], [400, 400]].map(([x, y]) => `<line x1="${x}" y1="${y}" x2="250" y2="170" ${S("accent", 2)}/>`).join(""),
    // 3 カニッツァの三角形
    () => `<rect width="400" height="400" ${F("bg")}/><polygon points="200,345 85,150 315,150" ${S("ink", 5)}/>`
        + [[200, 70], [70, 300], [330, 300]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="52" ${F("ink")}/>`).join("")
        + `<polygon points="200,70 70,300 330,300" ${F("bg")}/>`,
    // 4 同心円
    () => `<rect width="400" height="400" ${F("bg")}/>` + R(16, k => `<circle cx="${200 + k * 4}" cy="${200 - k * 2}" r="${300 - k * 18}" ${F(k % 2 ? "bg" : "ink")}/>`) + `<circle cx="264" cy="168" r="18" ${F("accent")}/>`,
    // 5 ミュラー・リヤー錯視
    () => `<rect width="400" height="400" ${F("bg")}/>`
        + `<line x1="110" y1="140" x2="290" y2="140" ${S("ink", 8)}/><polyline points="140,100 110,140 140,180" ${S("ink", 8)}/><polyline points="260,100 290,140 260,180" ${S("ink", 8)}/>`
        + `<line x1="110" y1="270" x2="290" y2="270" ${S("ink", 8)}/><polyline points="80,230 110,270 80,310" ${S("accent", 8)}/><polyline points="320,230 290,270 320,310" ${S("accent", 8)}/>`,
    // 6 タンブリング・ブロック
    () => { const s = 46, w = s * 0.866; let o = `<rect width="400" height="400" ${F("muted")}/>`;
        for (let r = -1; r < 7; r++) for (let c = -1; c < 7; c++) { const x = c * 2 * w + (r % 2 ? w : 0), y = r * 1.5 * s;
          o += `<polygon points="${x},${y - s} ${x + w},${y - s / 2} ${x},${y} ${x - w},${y - s / 2}" ${F("bg")}/><polygon points="${x - w},${y - s / 2} ${x},${y} ${x},${y + s} ${x - w},${y + s / 2}" ${F("ink")}/>`; }
        return o; },
    // 7 グリッド構成
    () => `<rect width="400" height="400" ${F("bg")}/><rect x="0" y="200" width="100" height="200" ${F("accent")}/>` + R(5, k => `<line x1="${k * 100}" y1="0" x2="${k * 100}" y2="400" ${S("ink", 2)}/><line x1="0" y1="${k * 100}" x2="400" y2="${k * 100}" ${S("ink", 2)}/>`),
    // 8 ヘルマン格子（交差点に灰色の点が見える）
    () => `<rect width="400" height="400" ${F("bg")}/>` + R(25, k => `<rect x="${12 + (k % 5) * 78}" y="${12 + Math.floor(k / 5) * 78}" width="64" height="64" ${F("ink")}/>`),
    // 9 エビングハウス錯視
    () => `<rect width="400" height="400" ${F("bg")}/><circle cx="110" cy="200" r="22" ${F("accent")}/>` + R(6, k => `<circle cx="${110 + 80 * Math.cos(k * Math.PI / 3)}" cy="${200 + 80 * Math.sin(k * Math.PI / 3)}" r="40" ${F("ink")}/>`)
        + `<circle cx="300" cy="200" r="22" ${F("accent")}/>` + R(8, k => `<circle cx="${300 + 40 * Math.cos(k * Math.PI / 4)}" cy="${200 + 40 * Math.sin(k * Math.PI / 4)}" r="9" ${F("ink")}/>`),
    // 10 ワイヤーフレーム（透視の製図）
    () => `<rect width="400" height="400" ${F("ink")}/><g style="fill:none;stroke:var(--bg);stroke-width:1.6">`
        + `<polygon points="50,235 200,150 350,235 200,320"/><polygon points="50,175 200,90 350,175 200,260"/>`
        + `<line x1="50" y1="175" x2="50" y2="235"/><line x1="200" y1="260" x2="200" y2="320"/><line x1="350" y1="175" x2="350" y2="235"/><line x1="200" y1="90" x2="200" y2="150" stroke-dasharray="3 6"/>`
        + `<ellipse cx="200" cy="175" rx="52" ry="30"/><line x1="200" y1="175" x2="200" y2="120"/><ellipse cx="200" cy="115" rx="26" ry="15"/>`
        + `<line x1="-20" y1="390" x2="420" y2="110" stroke-dasharray="2 10"/><line x1="20" y1="60" x2="390" y2="300" stroke-dasharray="1 8"/>`
        + `<path d="M -40 300 A 260 260 0 0 1 300 -20"/>`
        + [[50, 175], [200, 90], [350, 175], [200, 260], [50, 235], [350, 235], [200, 320]].map(([x, y]) => `<ellipse cx="${x}" cy="${y}" rx="9" ry="5"/>`).join("")
        + `<line x1="120" y1="285" x2="185" y2="250" style="stroke-width:1"/></g>`,
  ];
  return `<svg viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">${v[i % v.length]()}</svg>`;
}


/* ---------- パラメータ ---------- */
const BASE = {
  type: { display: "Helvetica Neue", weight: 700, titleSize: 15, tracking: -0.02, body: "Helvetica Neue", bodySize: 13, bodyTracking: 0, mono: "IBM Plex Mono", monoUpper: true },
  grid: { per: 4, gap: 20, margin: 32, maxw: 1400, radius: 2, pad: 16, cardStyle: "shadow", image: "fill", lines: "back", lineStyle: "dashed", lineOpacity: 0.18, lineWidth: 1, rows: true },
};
const PRESETS = {
  "Cosense Mono": { colors: { bg: "#efefed", card: "#ffffff", edge: "#e2e2e0", ink: "#111111", muted: "#7a7a7a", line: "#000000", accent: "#111111" } },
  "Cosense Blue": { colors: { bg: "#f2f2f2", card: "#ffffff", edge: "#e4e4e4", ink: "#333333", muted: "#888888", line: "#3355cc", accent: "#3355cc" }, grid: { lines: "none" } },
  "Paper Line":   { colors: { bg: "#f4f4f1", card: "#f4f4f1", edge: "#111111", ink: "#111111", muted: "#7a7a7a", line: "#000000", accent: "#111111" }, grid: { cardStyle: "line", radius: 0, gap: 0, lineOpacity: 0.3 } },
  "LINE Seed":    { colors: { bg: "#ffffff", card: "#f4f4f4", edge: "#e6e6e6", ink: "#000000", muted: "#808080", line: "#000000", accent: "#000000" },
                    grid: { cardStyle: "flat", radius: 14, gap: 16, lines: "none" },
                    type: { display: "LINE Seed JP", body: "LINE Seed JP", weight: 700, tracking: 0, mono: "LINE Seed JP", monoUpper: false } },
  "Night":        { colors: { bg: "#0e0e0e", card: "#1a1a1a", edge: "#2a2a2a", ink: "#f0f0f0", muted: "#8a8a8a", line: "#ffffff", accent: "#f0f0f0" }, grid: { cardStyle: "flat", lineOpacity: 0.12 } },
};
const CONTENT_DEFAULT = {
  name: "Yuma",
  tagline: "Media Art / Perspective / Optical Illusion",
  about: "パースペクティブを軸に、錯視を扱うメディアアーティスト / デザイナー。",
  showInfo: true, showNews: true, showWorks: true, showPosts: true,
};
const FONTS = ["Helvetica Neue", "LINE Seed JP", "Inter Tight", "Inter", "Archivo", "Arial", "Space Grotesk"];
const MONO = ["IBM Plex Mono", "LINE Seed JP", "Space Mono", "JetBrains Mono", "VT323", "DotGothic16", "Helvetica Neue"];
const STORE = "yuma-design-params-v5", SLOTS = "yuma-design-slots-v5";
const clone = o => JSON.parse(JSON.stringify(o));
function build(presetName, extra = {}) {
  const p = PRESETS[presetName] || {};
  return {
    preset: presetName,
    colors: { ...PRESETS["Cosense Mono"].colors, ...p.colors, ...extra.colors },
    type: { ...BASE.type, ...p.type, ...extra.type },
    grid: { ...BASE.grid, ...p.grid, ...extra.grid },
    content: { ...CONTENT_DEFAULT, ...extra.content },
  };
}
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let P = (() => { const s = store.get(STORE); return s ? build(s.preset, s) : build("Cosense Mono"); })();

/* ---------- 描画 ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let filter = "All";

function header() {
  return `<header class="top"><a class="logo" href="#">${esc(P.content.name)}<sup style="font-size:.35em">®</sup></a><div class="s m">${esc(P.content.tagline)}</div></header>`;
}
const postCard = (p, i) => `<a class="card" href="#post-${i}"><h3>${esc(p.title)}</h3><div class="img">${art(p.art)}</div></a>`;
function cardsHome() {
  const ct = P.content, out = [];
  const show = t => filter === "All" || filter === t;
  if (show("About")) out.push(`<a class="card" href="#"><h3>about</h3><div class="body txt"><div class="about-mark">${esc(ct.name)}<br>Studio</div><p class="m" style="margin-top:14px">${esc(ct.about)}</p></div></a>`);
  if (ct.showInfo && show("About")) out.push(`<div class="card"><h3>info</h3><div class="body txt lines">
    <div><span class="s m">contact</span>yuma(at)example.com</div>
    <div><span class="s m">github</span><a class="lnk" href="https://github.com/yumagarments">yumagarments</a></div>
    <div><span class="s m">instagram</span><a class="lnk" href="#">@yuma</a></div>
    <div><span class="s m">based in</span>Tokyo, JAPAN</div></div></div>`);
  if (ct.showNews && show("News")) out.push(`<div class="card"><h3>news</h3><div class="body txt lines">${NEWS.map(n => `<div><span class="s m">${n.date}</span><br><a class="lnk" href="#">${esc(n.title)}</a></div>`).join("")}</div></div>`);
  if (ct.showWorks && show("Works")) WORKS.forEach(w => out.push(`<a class="card" href="#"><h3>${esc(w.title)}</h3><span class="s m meta">${w.no}</span><div class="img">${art(w.art)}</div></a>`));
  if (ct.showPosts) POSTS.forEach((p, i) => { if (show("Notes") || show(p.tag)) out.push(postCard(p, i)); });
  return out.join("");
}
function home() {
  const tabs = ["All", "About", "News", "Works", "Notes", ...new Set(POSTS.map(p => p.tag))];
  return `${header()}<main class="frame">
    <div class="filters s">${tabs.map(t => `<button data-f="${t}"${t === filter ? ' class="on"' : ""}>${t}</button>`).join("")}</div>
    <div class="cards ${P.grid.cardStyle} ${P.grid.image}" id="cards">${cardsHome()}</div>
  </main>`;
}
function article(i) {
  const p = POSTS[i];
  const related = POSTS.map((q, j) => ({ q, j })).filter(({ q, j }) => j !== i && q.tag === p.tag).concat(POSTS.map((q, j) => ({ q, j })).filter(({ q, j }) => j !== i && q.tag !== p.tag)).slice(0, 4);
  return `${header()}<main class="frame">
    <article class="page ${P.grid.cardStyle}">
      <a class="s m" href="#">← ${esc(P.content.name)}</a>
      <h1>${esc(p.title)}</h1>
      <div class="s m">${p.date} &nbsp;/&nbsp; <a class="lnk" href="#" data-f="${p.tag}">#${p.tag}</a></div>
      <div class="fig">${art(p.art)}</div>
      <div class="prose">
        <p><b>${esc(p.text)}</b></p>
        <p>ここに本文が入ります。制作の経緯、参考にした論文や作品、うまくいかなかったことなどを、ノートのように書いていきます。</p>
        <h2>やったこと</h2>
        <p>まず手で作図して、次にコードに落とし込みました。消失点の位置を変えると見え方がどう変わるかを、何度も試しています。</p>
        <pre>// 消失点に向かうグリッド
for (let k = 0; k &lt; 17; k++)
  line(200, 160, -600 + k * 75, 400);</pre>
        <h2>メモ</h2>
        <ul><li>錯視は「間違い」ではなく、脳の推測のクセ</li><li>見る位置が 1 つに決まると、遠近法は強くなる</li></ul>
      </div>
    </article>
    <section class="related"><div class="filters s"><span class="m">Related —</span></div>
      <div class="cards ${P.grid.cardStyle} ${P.grid.image}">${related.map(({ q, j }) => postCard(q, j)).join("")}</div></section>
  </main>`;
}

function render() {
  const m = location.hash.match(/^#post-(\d+)$/);
  $("#app").innerHTML = m && POSTS[m[1]] ? article(Number(m[1])) : home();
  $("#ov-cols").innerHTML = "<i></i>".repeat(Number(P.grid.per));
  sizeCells();
}
// 横線をカードの行に揃える
function sizeCells() {
  const grid = $("#cards"), first = grid?.firstElementChild, rows = $("#ov-rows");
  if (!grid || !first || !P.grid.rows) { rows.innerHTML = ""; return; }
  const step = first.getBoundingClientRect().height + Number(P.grid.gap);
  document.documentElement.style.setProperty("--cell", step + "px");
  rows.style.top = (grid.getBoundingClientRect().top + scrollY) + "px";
  rows.innerHTML = "<b></b>".repeat(Math.ceil((document.body.scrollHeight - grid.offsetTop) / step) + 1);
}
function apply() {
  const r = document.documentElement.style, k = P.colors, t = P.type, g = P.grid;
  for (const x in k) r.setProperty("--" + x, k[x]);
  const stack = n => `"${n}", "Helvetica Neue", Helvetica, Arial, "Hiragino Sans", sans-serif`;
  r.setProperty("--font-d", stack(t.display));
  r.setProperty("--font-b", stack(t.body));
  r.setProperty("--font-m", `"${t.mono}", ui-monospace, Menlo, "Hiragino Sans", monospace`);
  r.setProperty("--mcase", t.monoUpper ? "uppercase" : "none");
  r.setProperty("--dw", t.weight);
  r.setProperty("--ts", t.titleSize + "px");
  r.setProperty("--tr", t.tracking + "em");
  r.setProperty("--bs", t.bodySize + "px");
  r.setProperty("--btr", t.bodyTracking + "em");
  r.setProperty("--per", g.per);
  r.setProperty("--gap", g.gap + "px");
  r.setProperty("--margin", g.margin + "px");
  r.setProperty("--maxw", g.maxw >= 2400 ? "100vw" : g.maxw + "px");
  r.setProperty("--radius", g.radius + "px");
  r.setProperty("--pad", g.pad + "px");
  r.setProperty("--lo", g.lineOpacity);
  r.setProperty("--lw", g.lineWidth + "px");
  r.setProperty("--ls", g.lineStyle);
  $("#overlay").className = "overlay " + g.lines;
  render();
  store.set(STORE, P);
}
addEventListener("hashchange", () => { render(); scrollTo(0, 0); });
addEventListener("resize", sizeCells);
document.fonts?.ready.then(sizeCells);
$("#app").addEventListener("click", e => {
  const b = e.target.closest("[data-f]"); if (!b) return;
  e.preventDefault(); filter = b.dataset.f;
  if (location.hash) location.hash = ""; else render();
});

/* ---------- パネル ---------- */
const CONTROLS = [
  ["カラー", [
    ["colors.bg", "背景", "color"], ["colors.card", "カード", "color"], ["colors.edge", "カードの枠", "color"],
    ["colors.ink", "文字", "color"], ["colors.muted", "補助文字", "color"], ["colors.accent", "リンク", "color"], ["colors.line", "グリッド線", "color"],
  ]],
  ["カード", [
    ["grid.per", "1 行の枚数", "range", 2, 7, 1, "枚"],
    ["grid.gap", "カード間隔", "range", 0, 48, 2, "px"],
    ["grid.cardStyle", "カードの見た目", "select", ["shadow", "line", "flat"]],
    ["grid.radius", "角丸", "range", 0, 20, 1, "px"],
    ["grid.pad", "カード内余白", "range", 8, 32, 1, "px"],
    ["grid.image", "画像の見せ方", "select", ["fill", "center"]],
    ["grid.margin", "左右の余白", "range", 8, 120, 4, "px"],
    ["grid.maxw", "最大幅", "range", 960, 2400, 40, "px"],
  ]],
  ["文字", [
    ["type.display", "タイトルフォント", "select", FONTS],
    ["type.weight", "タイトルの太さ", "select", [400, 500, 600, 700, 800, 900]],
    ["type.titleSize", "タイトルサイズ", "range", 11, 24, 1, "px"],
    ["type.tracking", "タイトル字間", "range", -0.08, 0.05, 0.005, "em"],
    ["type.body", "本文フォント", "select", FONTS],
    ["type.bodySize", "本文サイズ", "range", 10, 18, 1, "px"],
    ["type.bodyTracking", "本文字間", "range", -0.06, 0.1, 0.005, "em"],
    ["type.mono", "ラベルフォント", "select", MONO],
    ["type.monoUpper", "ラベルを大文字", "check"],
  ]],
  ["グリッド線", [
    ["grid.lines", "表示", "select", ["back", "front", "none"]],
    ["grid.lineStyle", "線の種類", "select", ["dashed", "dotted", "solid"]],
    ["grid.lineOpacity", "線の濃さ", "range", 0.03, 1, 0.01, ""],
    ["grid.lineWidth", "線の太さ", "range", 1, 3, 1, "px"],
    ["grid.rows", "横線（カードの行）", "check"],
  ]],
  ["テキスト・表示", [
    ["content.name", "名前", "text"],
    ["content.tagline", "肩書き", "text"],
    ["content.about", "紹介文", "textarea"],
    ["content.showInfo", "info カード", "check"],
    ["content.showNews", "news カード", "check"],
    ["content.showWorks", "作品カード", "check"],
    ["content.showPosts", "記事カード", "check"],
  ]],
];
const getK = k => k.split(".").reduce((o, x) => o[x], P);
const setK = (k, v) => { const [a, b] = k.split("."); P[a][b] = v; };
function ctrl([k, label, type, ...o]) {
  const v = getK(k), id = "c-" + k.replace(".", "-");
  let input, out = "";
  if (type === "color") input = `<input type="color" id="${id}" data-k="${k}" value="${v}">`, out = `<output>${v}</output>`;
  else if (type === "range") input = `<input type="range" id="${id}" data-k="${k}" min="${o[0]}" max="${o[1]}" step="${o[2]}" value="${v}" data-unit="${o[3]}">`, out = `<output>${k === "grid.maxw" && v >= 2400 ? "全幅" : v + o[3]}</output>`;
  else if (type === "select") input = `<select id="${id}" data-k="${k}">${o[0].map(x => `<option${x == v ? " selected" : ""}>${x}</option>`).join("")}</select>`;
  else if (type === "check") input = `<input type="checkbox" id="${id}" data-k="${k}"${v ? " checked" : ""}>`;
  else if (type === "text") input = `<input type="text" id="${id}" data-k="${k}" value="${esc(v)}">`;
  else input = `<textarea id="${id}" data-k="${k}">${esc(v)}</textarea>`;
  return `<div class="row2"><label for="${id}">${label}</label>${input}${out}</div>`;
}
function buildPanel() {
  const presetHTML = Object.keys(PRESETS).map(name => { const p = build(name);
    return `<button class="preset" data-preset="${name}"><b>${name}</b><div class="swatches">${["bg", "card", "ink", "muted", "accent", "line"].map(x => `<i style="background:${p.colors[x]}"></i>`).join("")}</div></button>`; }).join("");
  $("#panel-body").innerHTML = `
    <div class="presets">${presetHTML}</div>
    <p class="note">プリセットで土台を選び、下で細かく調整。変更は自動保存されます。</p>
    ${CONTROLS.map(([g, items], gi) => `<details${gi < 3 ? " open" : ""}><summary>${g}</summary>${items.map(ctrl).join("")}</details>`).join("")}
    <details open><summary>保存・書き出し</summary>
      <div class="btns"><button class="bt primary" id="copy-json">設定をコピー</button><button class="bt" id="dl-json">JSON をダウンロード</button><button class="bt" id="reset">初期化</button></div>
      <p class="note">「設定をコピー」して Claude に貼り付ければ、本番サイトに反映できます。</p>
      <textarea id="import-box" placeholder="ここに JSON を貼り付けて「読み込む」"></textarea>
      <div class="btns"><button class="bt" id="import-json">読み込む</button></div>
      <b style="display:block;margin-top:8px">比較用スロット</b>
      <div class="btns"><button class="bt" id="save-slot">今の設定をスロットに保存</button></div>
      <div id="slots"></div>
    </details>`;
  renderSlots();
}
function renderSlots() {
  const slots = store.get(SLOTS) || [];
  $("#slots").innerHTML = slots.length ? slots.map((s, i) => `<div class="slot"><span>${esc(s.name)}</span><button class="bt" data-load="${i}">読込</button><button class="bt" data-del="${i}">削除</button></div>`).join("")
    : `<p class="note">まだありません。気に入った案を保存して見比べられます。</p>`;
}
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 1600); }
const exportJSON = () => JSON.stringify(P, null, 2);
function load(obj) { P = build(obj.preset in PRESETS ? obj.preset : "Cosense Mono", obj); P.preset = obj.preset || "Custom"; apply(); buildPanel(); }

$("#panel-body").addEventListener("input", e => {
  const el = e.target, k = el.dataset.k; if (!k) return;
  let v = el.type === "checkbox" ? el.checked : el.value;
  if (el.type === "range" || k === "type.weight") v = Number(v);
  setK(k, v); P.preset = "Custom";
  const out = el.parentElement.querySelector("output");
  if (out) out.textContent = k === "grid.maxw" && v >= 2400 ? "全幅" : v + (el.dataset.unit || "");
  apply();
});
$("#panel-body").addEventListener("click", async e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.preset) {
    P = build(t.dataset.preset, { content: P.content, type: { ...P.type, ...BASE.type, ...(PRESETS[t.dataset.preset].type || {}) } }); apply(); buildPanel(); toast(t.dataset.preset + " を適用");
  } else if (t.id === "copy-json") {
    try { await navigator.clipboard.writeText(exportJSON()); toast("コピーしました"); }
    catch { $("#import-box").value = exportJSON(); toast("下の欄に出力しました（手動でコピー）"); }
  } else if (t.id === "dl-json") {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([exportJSON()], { type: "application/json" }));
    a.download = "design-params.json"; a.click(); toast("ダウンロードしました");
  } else if (t.id === "reset") {
    if (confirm("初期状態に戻しますか？")) { P = build("Cosense Mono"); apply(); buildPanel(); }
  } else if (t.id === "import-json") {
    try { load(JSON.parse($("#import-box").value)); toast("読み込みました"); } catch { toast("JSON の形式が正しくありません"); }
  } else if (t.id === "save-slot") {
    const name = prompt("スロット名", `${P.preset} ${new Date().toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" })}`);
    if (!name) return;
    const slots = store.get(SLOTS) || []; slots.push({ name, params: clone(P) }); store.set(SLOTS, slots); renderSlots(); toast("保存しました");
  } else if (t.dataset.load) {
    load(clone((store.get(SLOTS) || [])[t.dataset.load].params)); toast("読み込みました");
  } else if (t.dataset.del) {
    const slots = store.get(SLOTS) || []; slots.splice(t.dataset.del, 1); store.set(SLOTS, slots); renderSlots();
  }
});
$("#panel-toggle").onclick = () => $("#panel").classList.toggle("open");
$("#panel-close").onclick = () => $("#panel").classList.remove("open");

apply(); buildPanel();
</script>
</body>
</html>
