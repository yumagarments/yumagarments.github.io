name: Yuma Garments
tagline: Motion graphic designer
about: 1999年生まれ。東京を拠点に活動する映像作家・モーショングラフィックデザイナー。キーフレームによるシームレスな変容や、遠近法、錯視的な構造を取り入れたアニメーション表現を制作している。斜視による自身の視覚経験を背景に、空間や物体が「自然に見える」条件と、動きの中で生まれる認知のずれを探究。
