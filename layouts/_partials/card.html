{{ $pg := .page }}
{{ $tags := slice }}{{ range $pg.Params.tags }}{{ $tags = $tags | append (urlize .) }}{{ end }}
<a class="card" href="{{ $pg.RelPermalink }}" data-kind="{{ $pg.Section }}" data-tags="{{ delimit $tags " " }}">
  <div class="img">{{ partial "visual.html" $pg }}</div>
  <div class="head"><h3><span class="t">{{ $pg.Title }}</span><span class="flow" aria-hidden="true"><span>{{ $pg.Title }}</span><span>{{ $pg.Title }}</span></span></h3><span class="date s" title="更新日">{{ $pg.Lastmod.Format "2006.01.02" }}</span></div>
</a>
