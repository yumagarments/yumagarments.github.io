<ul class="post-list">
  {{ range . }}
  <li>
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
    <div>
      <a class="post-title" href="{{ .RelPermalink }}">{{ .Title }}</a>
      {{ with .Params.tags }}<span class="tags">{{ range . }}<a class="tag" href="{{ (printf "tags/%s/" (. | urlize)) | relURL }}">#{{ . }}</a>{{ end }}</span>{{ end }}
    </div>
  </li>
  {{ else }}
  <li class="empty">まだ記事はありません。</li>
  {{ end }}
</ul>
