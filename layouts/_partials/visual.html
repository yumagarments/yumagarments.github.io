{{- with .Params.image -}}<img src="{{ . | relURL }}" alt="" loading="lazy">
{{- else with .Params.video -}}{{- with findRESubmatch `(?:v=|youtu\.be/|shorts/|embed/)([A-Za-z0-9_-]{11})` . 1 -}}<img src="https://i.ytimg.com/vi/{{ index (index . 0) 1 }}/maxresdefault.jpg" alt="" loading="lazy">{{- end -}}
{{- else -}}{{ $n := mod (len $.Title) 11 }}{{ if isset $.Params "art" }}{{ $n = $.Params.art }}{{ end }}<div class="art" data-art="{{ $n }}"></div>{{- end -}}
