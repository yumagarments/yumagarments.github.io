# サイト全体の設定
# 名前・紹介文・連絡先は data/profile.yaml、デザイン（色・文字・余白）は data/design.json で変更します
baseURL = "https://yumagarments.github.io/"
locale = "ja"
title = "Yuma Garments"

[taxonomies]
  tag = "tags"

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = true
    style = "bw"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[params]
  # 閲覧数の計測（GoatCounter）。https://www.goatcounter.com で登録したコード名を入れると有効になります
  goatcounter = ""
